<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Module 12 - Filmcollectie beheren</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand fw-bold">🎬 Mijn Filmcollectie</span>
      </div>
    </nav>

    <main class="container my-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Films</h1>
        <button class="btn btn-primary" id="add-button">+ Film toevoegen</button>
      </div>

      <!-- Zoekbalk en sorteer-keuze -->
      <div class="row g-2 mb-4">
        <div class="col-md-8">
          <input
            id="search"
            type="search"
            class="form-control"
            placeholder="Zoek op titel of genre..."
          />
        </div>
        <div class="col-md-4">
          <select id="sort" class="form-select">
            <option value="titel">Sorteer op titel (A-Z)</option>
            <option value="jaar">Sorteer op jaar (nieuw eerst)</option>
            <option value="score">Sorteer op score (hoog eerst)</option>
          </select>
        </div>
      </div>

      <div class="row g-4" id="films-container"></div>
    </main>

    <script src="index.js"></script>
  </body>
</html>
