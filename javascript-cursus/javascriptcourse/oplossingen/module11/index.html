<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Module 11 - Filmcollectie</title>
    <!-- Bootstrap CSS via CDN (jij schrijft geen eigen CSS) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navbar (Bootstrap-klassen) -->
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand fw-bold">🎬 Mijn Filmcollectie</span>
      </div>
    </nav>

    <main class="container my-4">
      <h1 class="mb-4">Films</h1>

      <!-- Hier komen de filmkaartjes in. Een Bootstrap "row" met kolommen. -->
      <div class="row g-4" id="films-container"></div>
    </main>

    <!-- VOORBEELD van één kaartje (puur ter referentie; staat verborgen).
         Dit is de markup die je in JavaScript gaat nabouwen met createElement. -->
    <template id="film-template">
      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Filmtitel</h5>
            <h6 class="card-subtitle mb-2 text-muted">Genre</h6>
            <p class="card-text">2024 · ⭐ 8.5</p>
          </div>
        </div>
      </div>
    </template>

    <!-- Onze JavaScript staat nu in een APART bestand -->
    <script src="index.js"></script>
  </body>
</html>
