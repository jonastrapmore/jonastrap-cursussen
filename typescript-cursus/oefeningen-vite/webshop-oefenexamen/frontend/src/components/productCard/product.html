<div class="card mb-3" style="width: 16rem">
  <div class="card-body">
    <h5 class="card-title" id="title"></h5>
    <h6 class="card-subtitle mb-2 text-muted" id="date"></h6>
    <p class="card-text">
      <strong>Name:</strong> <span id="name"></span><br>
      <strong>Price:</strong> <span id="price"></span><br>
      <strong>Category:</strong> <span id="category"></span>
    </p>
    <button id="add-button" class="btn btn-outline-primary">+</button>
    <button id="discount-button" class="btn btn-outline-primary">-10%</button>
  </div>
</div>
